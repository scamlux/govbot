# GovBot frontend (nginx) — serves the SPA and reverse-proxies the API/admin to the
# backend container, so the whole app is single-origin on one port.

# Preserve the original client scheme when we sit behind an outer TLS proxy
# (e.g. Caddy terminates HTTPS and forwards HTTP to us). Fall back to our own
# scheme for direct access. Without this Django sees "http", and
# SECURE_SSL_REDIRECT bounces every /api request in a 301 loop.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # ---- API -> Django (SSE/streaming friendly: buffering off) ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- Django admin + its static assets ----
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # ---- Hashed SPA assets: long cache ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- PWA service worker: never cache, so updates propagate on next visit ----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
    }

    # ---- SPA client-side routing ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
