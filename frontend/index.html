<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="TOtDtnceVs9-irYbtqHA0-ru15mNT9FTpXb9zbYQDQY" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#0c6c8a" />
    <!-- interactive-widget=resizes-content: when the on-screen keyboard opens,
         the browser shrinks the layout viewport instead of overlaying it, so the
         chat composer stays visible above the keyboard. Ignored where
         unsupported (no regression). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="GovBot — Government Information Made Simple Through AI. Multilingual answers about Uzbekistan public services."
    />
    <title>GovBot — Government Information Made Simple</title>
    <meta name="author" content="GovBot" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GovBot" />
    <meta property="og:url" content="https://govbot-web.vercel.app/" />
    <meta property="og:title" content="GovBot — Government Information Made Simple" />
    <meta
      property="og:description"
      content="Ask about Uzbekistan public services and get clear, multilingual answers powered by AI."
    />
    <meta property="og:image" content="https://govbot-web.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GovBot — AI assistant for Uzbekistan public services" />
    <meta property="og:locale" content="uz_UZ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GovBot — Government Information Made Simple" />
    <meta
      name="twitter:description"
      content="Ask about Uzbekistan public services and get clear, multilingual answers powered by AI."
    />
    <meta name="twitter:image" content="https://govbot-web.vercel.app/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "GovBot",
            "url": "https://govbot-web.vercel.app",
            "logo": "https://govbot-web.vercel.app/icon.svg",
            "description": "AI assistant that makes Uzbekistan government information and public services simple."
          },
          {
            "@type": "WebSite",
            "name": "GovBot",
            "url": "https://govbot-web.vercel.app",
            "description": "Government Information Made Simple Through AI. Multilingual answers about Uzbekistan public services.",
            "inLanguage": ["uz", "ru", "en"]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
