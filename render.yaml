# Render Blueprint — GovBot backend (Django + gunicorn) + managed Postgres.
# One-click provisioning: Render dashboard → New → Blueprint → connect this repo → Apply.
# The Vite frontend is deployed separately on Vercel (see DEPLOY.md).
#
# Native container (not serverless) so SSE streaming chat keeps working. The backend
# Dockerfile CMD binds $PORT (Render injects it); entrypoint runs migrate + seed +
# collectstatic on each boot. RENDER_EXTERNAL_HOSTNAME is auto-trusted by settings for
# ALLOWED_HOSTS / CSRF, so no manual host wiring is needed.
#
# This Blueprint provisions a Render-managed Postgres (govbot-db) and injects its
# connection string as DATABASE_URL automatically — no external DB account required.
# NOTE: Render's FREE Postgres plan is deleted ~90 days after creation. For a long-lived
# deployment, upgrade the database `plan` (e.g. `basic-256mb`) or point DATABASE_URL at an
# external managed Postgres (e.g. Supabase direct/session-pooler — see DEPLOY.md).

databases:
  - name: govbot-db
    plan: free
    region: oregon

services:
  - type: web
    name: govbot-backend
    runtime: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/scenarios/categories/
    autoDeploy: true
    envVars:
      # Render generates a strong secret → satisfies the insecure-key boot guard.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Production DB — Supabase session pooler (set in the dashboard, kept out of the
      # repo). The Render-managed govbot-db below is retired but kept as a rollback until
      # its free-plan expiry; repoint this var at it to roll back.
      - key: DATABASE_URL
        sync: false
      # Shared secret for POST /api/internal/kb/tick/ — a Supabase pg_cron job drains the
      # Knowledge Base reindex queue through it every 2 minutes (set in the dashboard).
      - key: KB_TICK_SECRET
        sync: false
      # OpenAI — set in the dashboard (kept out of the repo). Omit → chat runs in mock mode.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Vercel frontend origin for browser CORS + SSE. OPTIONAL: any *.vercel.app origin
      # is auto-trusted by settings, so the SPA works without this. Set it to your exact
      # URL (comma-separate several) to also allow a custom domain or to lock CORS down.
      # e.g. https://<your-app>.vercel.app  (no trailing slash).
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WEB_CONCURRENCY
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"
