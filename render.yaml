# Render Blueprint — GovBot backend (Django + gunicorn) + managed Postgres.
# One-click provisioning: Render dashboard → New → Blueprint → connect this repo.
# The Vite frontend is deployed separately on Vercel (see DEPLOY.md).
#
# Native container (not serverless) so SSE streaming chat keeps working. The backend
# Dockerfile CMD binds $PORT (Render injects it); entrypoint runs migrate + seed +
# collectstatic on each boot. RENDER_EXTERNAL_HOSTNAME is auto-trusted by settings for
# ALLOWED_HOSTS / CSRF, so no manual host wiring is needed.

# DB is external (Supabase). No Render-managed Postgres — DATABASE_URL is set as a
# dashboard secret (sync: false) pointing at the Supabase connection string.
# Use Supabase's DIRECT connection (port 5432) or the SESSION pooler — NOT the transaction
# pooler (6543), which is incompatible with Django's persistent CONN_MAX_AGE connections.

services:
  - type: web
    name: govbot-backend
    runtime: docker
    # Code currently lives on the PR branch (not yet merged to main). Switch this to
    # `main` once PR #1 is merged.
    branch: worktree-backlog-impl
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/scenarios/categories/
    autoDeploy: true
    envVars:
      # Render generates a strong secret → satisfies the S1 insecure-key guard.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Supabase Postgres connection string (direct 5432 / session pooler). Set in dashboard.
      - key: DATABASE_URL
        sync: false
      # OpenAI — set in the dashboard (kept out of the repo). Omit → chat runs in mock mode.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Set to the Vercel URL after the frontend deploy so CORS/SSE allow it.
      - key: FRONTEND_ORIGIN
        sync: false
      - key: WEB_CONCURRENCY
        value: "3"
      - key: PYTHONUNBUFFERED
        value: "1"
