name: keep-backend-warm

# GovBot's backend runs on Render's FREE plan, which spins the container down after
# ~15 min of inactivity. The next visitor then pays a 30–60 s cold start (the "scenarios
# take 40 seconds" symptom). Warm latency is ~0.4 s, so this is purely the sleep/wake,
# not the query. This scheduled ping keeps the service awake during active hours.
#
# The repo is public, so Actions minutes here are free and unmetered.
#
# Coverage window: every 10 min, 03:00–18:00 UTC (~08:00–23:00 Asia/Tashkent). This keeps
# the instance warm through the day while leaving it asleep overnight, so we stay well
# under Render's free 750 instance-hours/month cap. Widen the cron for 24/7 coverage, or —
# the only way to eliminate cold starts entirely — upgrade the Render service to Starter.
#
# NOTE: GitHub's scheduled runs are best-effort and can be delayed several minutes under
# load, so an occasional cold start may still slip through. That's acceptable for free tier.

on:
  schedule:
    - cron: "*/10 3-17 * * *"
  workflow_dispatch: {}

# If a run is somehow still going when the next fires, don't stack them.
concurrency:
  group: keep-backend-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://govbot-backend-3utu.onrender.com/api/scenarios/categories/"
          echo "Pinging $URL"
          code=$(curl -sS -m 90 -o /dev/null -w "%{http_code} %{time_total}s" "$URL" || echo "000 timeout")
          echo "Result: $code"
          # Don't fail the workflow on a slow cold-start response — the ping itself is
          # what matters; the next visitor lands on the now-warm instance.
